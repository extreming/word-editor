services:
  word-editor:
    build: .
    image: word-editor
    container_name: word-editor

    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - /home/aiadmin/word-editor/data:/app/data:Z
      - ./certs/host-ca-bundle.crt:/app/certs/host-ca-bundle.crt:ro,Z

    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      DATA_DIR: "/app/data"
      SOFFICE_PATH: "/usr/bin/soffice"
      NODE_EXTRA_CA_CERTS: "/app/certs/host-ca-bundle.crt"
      # The signing secret and environment-specific backend address are loaded
      # from the local .env file. Compose refuses to start if either is missing.
      TOKEN_SECRET: "${TOKEN_SECRET:?TOKEN_SECRET is required}"
      LEGALAI_BASE_URL: "${LEGALAI_BASE_URL:?LEGALAI_BASE_URL is required}"
      LEGALAI_CONTENT_PATH: "/zOffice/{docId}/content"
      LEGALAI_TOKEN_HEADER: "token"
      LEGALAI_REQUEST_TIMEOUT_MS: "30000"
      # Draft autosave remains enabled inside word-editor. This switch only
      # controls periodic publication of the complete DOCX to LegalAI.
      LEGALAI_AUTO_COMMIT_ENABLED: "false"
      LEGALAI_AUTO_COMMIT_INTERVAL_MS: "300000"
      VERSION_HISTORY_ENABLED: "${VERSION_HISTORY_ENABLED:-true}"

    restart: unless-stopped
