services:
  word-editor:
    build: .
    image: word-editor
    container_name: word-editor

    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - /home/aiadmin/word-editor/data:/app/data:Z
      - /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/ssl/certs/host-ca-bundle.crt:ro

    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      DATA_DIR: "/app/data"
      STORAGE_DRIVER: "local"
      SOFFICE_PATH: "/usr/bin/soffice"
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/host-ca-bundle.crt"
      # LegalAI development environment integration.
      # Change LEGALAI_BASE_URL when deploying this compose file elsewhere.
      TOKEN_SECRET: "4245afd2abbfdcdb4e960bcee70389902b47f1e0ca0d11fc992dc61ad4da293b"
      LEGALAI_BASE_URL: "https://legalai-gtm-backend-dev.t-sy-in.earth.xcloud.lenovo.com/legalai"
      LEGALAI_CONTENT_PATH: "/doc-editor/{docId}/content"
      LEGALAI_TOKEN_HEADER: "token"
      LEGALAI_REQUEST_TIMEOUT_MS: "30000"
      # Draft autosave remains enabled inside word-editor. This switch only
      # controls periodic publication of the complete DOCX to LegalAI/S3.
      LEGALAI_AUTO_COMMIT_ENABLED: "false"
      LEGALAI_AUTO_COMMIT_INTERVAL_MS: "300000"
      VERSION_HISTORY_ENABLED: "false"
      # Local working-data lifecycle. Successful SDK close + last WebSocket
      # departure cleans immediately; the daily sweep applies the 24h fallback.
      DATA_RETENTION_HOURS: "24"
      DATA_CLEANUP_INTERVAL_MS: "86400000"
      STARTUP_DRAFT_PURGE_ENABLED: "true"
      DISK_CHECK_INTERVAL_MS: "300000"
      DISK_WARNING_PERCENT: "70"
      DISK_CRITICAL_PERCENT: "85"

    restart: unless-stopped
