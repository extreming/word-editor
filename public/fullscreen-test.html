<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DocEditor 全屏测试</title>
  <style>
    html, body, #editor-holder {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
    }
    body { background: #f5f6f8; }
    #editor-holder iframe { width: 100%; height: 100%; border: 0; display: block; }
    #test-state {
      position: fixed; top: 10px; right: 12px; z-index: 10;
      max-width: min(520px, calc(100vw - 24px)); padding: 6px 10px;
      border: 1px solid rgba(0, 0, 0, .12); border-radius: 6px;
      background: rgba(255, 255, 255, .94); color: #596273;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
      font: 12px/1.4 -apple-system, "Segoe UI", sans-serif;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      pointer-events: none; transition: opacity .2s ease;
    }
    #test-state.ready { opacity: 0; transition-delay: 1.5s; }
    #test-state.error { color: #b42318; opacity: 1; transition-delay: 0s; }
  </style>
</head>
<body>
  <div id="editor-holder"></div>
  <div id="test-state">正在打开编辑器…</div>

  <script src="/js/sdk.js"></script>
  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "word-editor:fullscreen-test:last-document-id";
      const state = document.getElementById("test-state");
      const params = new URLSearchParams(location.search);
      const requestedId = (params.get("doc") || "").trim();
      let rememberedId = "";
      let initialRequestCleared = false;
      try { rememberedId = localStorage.getItem(STORAGE_KEY) || ""; } catch {}

      function rememberDocument(info) {
        if (!info || !info.id) return;
        try { localStorage.setItem(STORAGE_KEY, info.id); } catch {}
        // `doc` selects only the initial document. Remove it after a
        // successful load so a later library switch becomes the document a
        // normal browser refresh restores, rather than reopening the stale
        // ID that was originally present in the address bar.
        if (requestedId && !initialRequestCleared) {
          const cleanUrl = new URL(location.href);
          cleanUrl.searchParams.delete("doc");
          history.replaceState(null, "", cleanUrl);
          initialRequestCleared = true;
        }
        state.textContent = `${info.title || "文档"} · ${info.id}`;
        state.className = "ready";
      }

      const editor = DocEditor.init({
        container: "#editor-holder",
        docId: requestedId || rememberedId || undefined,
        user: "Fullscreen-Test",
        toolbar: true,
        statusbar: true,
        onReady: rememberDocument,
        onDocument: rememberDocument,
        onError(error) {
          state.textContent = `编辑器加载失败：${error && error.message ? error.message : String(error)}`;
          state.className = "error";
        },
      });

      // Kept public for manual SDK testing from the browser console.
      window.fullscreenEditor = editor;
    })();
  </script>
</body>
</html>
